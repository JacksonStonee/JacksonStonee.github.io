# -----------------------------------------------------------------------------
# Site — Minimal Mistakes (remote theme) for jacksonstonee.github.io
# -----------------------------------------------------------------------------

# Theme
remote_theme            : "mmistakes/minimal-mistakes"
minimal_mistakes_skin   : "default"   # "default" | "air" | "aqua" | "contrast" | "dark" | "dirt" | "mint" | "neon" | "plum" | "sunrise"

# Site
locale                  : "en-US"
title                   : "Jackson Stone"
title_separator         : "-"
name                    : "Jackson Stone"
description             : "Incident Response & Offensive Security"
url                     : "https://jacksonstonee.github.io"   # user-level GitHub Pages site
baseurl                 : ""                                  # no baseurl for user sites
repository              : "jacksonstonee/jacksonstonee.github.io"
teaser                  : # /assets/images/teaser.jpg
logo                    : # /assets/images/site-logo.png
words_per_minute        : 200
enable_copy_code_button : true
search                  : true

# Comments / share / analytics — off in initial config
comments:
  provider              : false
atom_feed:
  hide                  : false
analytics:
  provider              : false

# SEO
og_image                : /assets/images/bio-photo.png
social:
  type                  : Person
  name                  : "Jackson Stone"
  links:
    - "https://github.com/JacksonStonee"
    - "https://www.linkedin.com/in/jackson-stone1/"

# -----------------------------------------------------------------------------
# Author sidebar
# -----------------------------------------------------------------------------
author:
  name                  : "Jackson Stone"
  avatar                : "/assets/images/bio-photo.png"
  bio                   : "Senior Incident Responder"
  location              : # "City, Country"
  links:
    - label             : "GitHub"
      icon              : "fab fa-fw fa-github"
      url               : "https://github.com/JacksonStonee"
    - label             : "LinkedIn"
      icon              : "fab fa-fw fa-linkedin"
      url               : "https://www.linkedin.com/in/jackson-stone1/"
    # - label           : "Twitter"
    #   icon            : "fab fa-fw fa-x-twitter"
    #   url             : "https://x.com/YOUR_HANDLE"

# Footer social icons (mirror author links)
footer:
  links:
    - label             : "GitHub"
      icon              : "fab fa-fw fa-github"
      url               : "https://github.com/JacksonStonee"
    - label             : "LinkedIn"
      icon              : "fab fa-fw fa-linkedin"
      url               : "https://www.linkedin.com/in/jackson-stone1/"
    # - label           : "Twitter"
    #   icon            : "fab fa-fw fa-x-twitter"
    #   url             : "https://x.com/YOUR_HANDLE"

# -----------------------------------------------------------------------------
# Build / includes
# -----------------------------------------------------------------------------
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Reading files
markdown                : kramdown
highlighter             : rouge
lsi                     : false
excerpt_separator       : "\n\n"
incremental             : false

# Conversion / kramdown
kramdown:
  input                 : GFM
  hard_wrap             : false
  auto_ids              : true
  footnote_nr           : 1
  entity_output         : as_char
  toc_levels            : 1..6
  smart_quotes          : lsquo,rsquo,ldquo,rdquo
  enable_coderay        : false

# Sass
sass:
  sass_dir              : _sass
  style                 : compressed

# Permalinks
permalink               : /:categories/:title/
paginate                : 5
paginate_path           : /page:num/
timezone                : # e.g. "America/Los_Angeles"

# -----------------------------------------------------------------------------
# Plugins (GitHub Pages allow-list)
# -----------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist

# mimic github-pages default plugins
whitelist:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  posts:
    output              : true
    permalink           : /:categories/:title/

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------
defaults:
  # posts
  - scope:
      path              : ""
      type              : posts
    values:
      layout            : single
      author_profile    : true
      read_time         : true
      comments          : false
      share             : false
      related           : true
      show_date         : true
      toc               : true
      toc_sticky        : true
  # _pages
  - scope:
      path              : "_pages"
      type              : pages
    values:
      layout            : single
      author_profile    : true
